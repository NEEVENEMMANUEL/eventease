# Local / Staging / Production all use this same stack.
# Only the .env values differ between environments.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventease}
      POSTGRES_DB: ${POSTGRES_DB:-eventease}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventease}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # In CI/Prod this is replaced by the GHCR image tag; locally we build.
    image: ${APP_IMAGE:-eventease-app:local}
    build:
      context: .
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-local}
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventease}:${POSTGRES_PASSWORD:-eventease}@db:5432/${POSTGRES_DB:-eventease}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
