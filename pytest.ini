[pytest]
# Put the repo root on sys.path so `from app import ...` works no matter how
# pytest is invoked (bare `pytest` in CI does NOT add cwd to sys.path).
pythonpath = .
testpaths = tests
# By default run unit + integration only. E2E (browser) tests are opt-in
# with `pytest tests/e2e -m e2e` and run against a live Staging deployment.
addopts = -ra -m "not e2e"
markers =
    e2e: end-to-end browser tests (require a running server)
