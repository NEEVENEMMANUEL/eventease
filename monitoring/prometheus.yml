# Prometheus scrape config for the Production server.
# Deploy alongside the app container (see brief Section 1.1).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eventease-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
